<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus · 蕃茄鐘</title>
  <meta name="description" content="蕃茄鐘 + 待辦事項 + 每週回顧" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Focus" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e16;
      --surface: #16162a;
      --surface2: #1e1e38;
      --border: rgba(255,255,255,0.07);
      --text: #e8e6f0;
      --muted: #7a789a;
      --accent: #c8b8f8;
      --accent2: #f8a4c8;
      --accent3: #a4f8d8;
      --tomato: #ff6b5b;
      --tomato-glow: rgba(255,107,91,0.3);
      --break: #5bc8ff;
      --break-glow: rgba(91,200,255,0.3);
      --radius: 16px;
    }

    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(200,184,248,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(255,107,91,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 16px; width: 100%; }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .nav-logo {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-style: italic;
    }
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
      font-family: inherit;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { background: var(--surface2); color: var(--accent); }

    /* ── Page sections ── */
    .page { display: none; animation: fadeUp 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Timer Card ── */
    .timer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 32px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .timer-card::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 200px; height: 200px;
      border-radius: 50%;
      background: var(--tomato-glow);
      filter: blur(60px);
      transition: background 0.5s;
    }
    .timer-card.break-mode::before { background: var(--break-glow); }

    .mode-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Circular Progress */
    .timer-ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 24px;
    }
    .timer-ring {
      transform: rotate(-90deg);
      width: 220px;
      height: 220px;
    }
    .ring-track {
      fill: none;
      stroke: var(--surface2);
      stroke-width: 6;
    }
    .ring-progress {
      fill: none;
      stroke: var(--tomato);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease, stroke 0.5s;
      stroke-dasharray: 628;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 8px var(--tomato));
    }
    .break-mode .ring-progress {
      stroke: var(--break);
      filter: drop-shadow(0 0 8px var(--break));
    }
    .timer-display {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .timer-time {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .timer-session {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.1em;
    }

    /* Controls */
    .timer-controls { display: flex; justify-content: center; gap: 12px; }
    .btn {
      border: none;
      border-radius: 100px;
      font-family: 'DM Mono', monospace;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--tomato);
      color: #fff;
      padding: 14px 36px;
      font-size: 13px;
      box-shadow: 0 4px 20px var(--tomato-glow);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--tomato-glow); }
    .btn-primary:active { transform: translateY(0); }
    .break-mode .btn-primary { background: var(--break); box-shadow: 0 4px 20px var(--break-glow); }
    .btn-ghost {
      background: var(--surface2);
      color: var(--muted);
      padding: 14px 20px;
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); }

    /* Settings row */
    .timer-settings {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .setting-item {
      text-align: center;
      cursor: pointer;
    }
    .setting-value {
      font-size: 18px;
      font-weight: 400;
      color: var(--accent);
    }
    .setting-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .setting-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* ── Current Task Banner ── */
    .current-task-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .current-task-banner:hover { border-color: rgba(200,184,248,0.2); }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--tomato);
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--tomato);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .current-task-text {
      flex: 1;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .current-task-text.empty { color: var(--muted); font-style: italic; }

    /* ── Todos ── */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .btn-add {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add:hover { background: var(--accent); color: var(--bg); }

    .todo-input-row {
      display: none;
      margin-bottom: 10px;
      gap: 8px;
    }
    .todo-input-row.visible { display: flex; }
    .todo-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .todo-input:focus { border-color: rgba(200,184,248,0.4); }
    .todo-input::placeholder { color: var(--muted); }
    .btn-confirm {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }

    .todo-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px; }
    .todo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .todo-item:hover { border-color: rgba(200,184,248,0.15); }
    .todo-item.active-task { border-color: rgba(200,184,248,0.4); background: rgba(200,184,248,0.05); }
    .todo-item.done .todo-item-text { text-decoration: line-through; color: var(--muted); }
    .todo-check {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--muted);
      flex-shrink: 0;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }
    .todo-item.done .todo-check { background: var(--accent3); border-color: var(--accent3); color: var(--bg); }
    .todo-item-text { flex: 1; font-size: 13px; }
    .todo-pomodoros {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .todo-delete {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .todo-item:hover .todo-delete { opacity: 1; }
    .todo-delete:hover { color: var(--tomato); }

    /* ── Session Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid rgba(200,184,248,0.2);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      transform: translateY(20px);
      transition: transform 0.3s;
    }
    .modal-overlay.visible .modal { transform: translateY(0); }
    .modal-title {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 300;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .modal-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      outline: none;
      resize: none;
      min-height: 100px;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .modal-textarea:focus { border-color: rgba(200,184,248,0.4); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-modal-skip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 100px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-modal-save {
      background: var(--accent);
      color: var(--bg);
      padding: 10px 24px;
      border-radius: 100px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }
    /* Task select in modal */
    .modal-task-row {
      margin-bottom: 16px;
    }
    .modal-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .modal-task-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .task-chip {
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .task-chip.selected { background: rgba(200,184,248,0.15); border-color: var(--accent); color: var(--accent); }

    /* ── Weekly Review ── */
    .week-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .week-arrow {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      transition: all 0.2s;
    }
    .week-arrow:hover { color: var(--text); }
    .week-label { flex: 1; text-align: center; font-size: 13px; color: var(--accent); }

    .review-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 300;
      color: var(--accent);
      font-family: 'Fraunces', serif;
      font-style: italic;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .sessions-list { display: flex; flex-direction: column; gap: 6px; }
    .session-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .session-task { font-size: 12px; color: var(--text); }
    .session-time { font-size: 10px; color: var(--muted); }
    .session-note { font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.5; margin-top: 4px; }
    .day-group-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
      line-height: 1.8;
    }

    /* Settings edit modal */
    .setting-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      width: 80px;
      text-align: center;
      outline: none;
    }

    /* PWA install banner */
    .install-banner {
      background: linear-gradient(135deg, rgba(200,184,248,0.1), rgba(255,107,91,0.05));
      border: 1px solid rgba(200,184,248,0.2);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 12px;
    }
    .install-banner.show { display: flex; }
    .install-banner-text { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .btn-install {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 100px;
      padding: 8px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .banner-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
    }

    /* Bottom padding for scroll */
    .spacer { height: 40px; }

    /* ── Gacha ── */
    #gachaModal { z-index: 110; }

    .modal--gacha {
      align-items: center;
      text-align: center;
      padding: 28px 24px 24px;
      max-width: 340px;
    }

    .gacha-machine { width: 100%; }

    .gacha-machine__header {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      margin-bottom: 4px;
      color: var(--text);
    }

    .gacha-machine__sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .gacha-viewport {
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 20px;
    }

    /* Idle capsule */
    .gacha-idle-capsule {
      font-size: 80px;
      display: flex;
      animation: gachaWobble 2s ease-in-out infinite;
    }

    /* Spinner */
    .gacha-spinner {
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 120px;
      height: 120px;
    }

    .gacha-capsule-spin {
      font-size: 72px;
      position: relative;
      z-index: 1;
      animation: gachaSpin 1.8s ease-in-out forwards;
    }

    .gacha-spin-rings {
      position: absolute;
      inset: 0;
    }

    .gacha-spin-rings::before,
    .gacha-spin-rings::after {
      content: '';
      position: absolute;
      inset: -10px;
      border: 2px solid var(--tomato);
      border-radius: 50%;
      animation: gachaRingPulse 0.9s ease-out infinite;
    }

    .gacha-spin-rings::after { animation-delay: 0.45s; }

    /* Result */
    .gacha-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .gacha-result__emoji {
      font-size: 72px;
      line-height: 1;
    }

    .gacha-result__rarity {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .gacha-result__rarity[data-rarity="common"]    { color: var(--muted); }
    .gacha-result__rarity[data-rarity="rare"]      { color: var(--break); }
    .gacha-result__rarity[data-rarity="legendary"] { color: gold; }

    .gacha-result__name {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      color: var(--text);
    }

    .gacha-result__desc {
      font-size: 11px;
      color: var(--muted);
      max-width: 220px;
      line-height: 1.5;
    }

    .gacha-new-badge {
      background: var(--tomato);
      color: white;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      padding: 3px 10px;
      border-radius: 100px;
      animation: newBadgeBounce 0.6s ease-in-out infinite;
      display: none;
    }

    /* Actions */
    .gacha-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-gacha-draw {
      background: linear-gradient(135deg, var(--tomato), #ff9a3c);
      color: white;
      border: none;
      border-radius: 100px;
      padding: 13px 36px;
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--tomato-glow);
      transition: transform 0.15s, box-shadow 0.15s;
      display: block;
    }

    .btn-gacha-draw:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 28px var(--tomato-glow);
    }

    .btn-gacha-draw:active { transform: scale(0.97); }

    .btn-gacha-close {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 100px;
      padding: 10px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s;
      display: none;
    }

    .btn-gacha-close:hover { color: var(--text); }

    /* State machine: idle */
    .gacha-machine[data-state="idle"] .gacha-idle-capsule { display: flex; }
    .gacha-machine[data-state="idle"] .gacha-spinner      { display: none; }
    .gacha-machine[data-state="idle"] .gacha-result       { display: none; }
    .gacha-machine[data-state="idle"] .btn-gacha-draw     { display: block; }
    .gacha-machine[data-state="idle"] .btn-gacha-close    { display: none; }

    /* State machine: spinning */
    .gacha-machine[data-state="spinning"] .gacha-idle-capsule { display: none; }
    .gacha-machine[data-state="spinning"] .gacha-spinner      { display: flex; }
    .gacha-machine[data-state="spinning"] .gacha-result       { display: none; }
    .gacha-machine[data-state="spinning"] .btn-gacha-draw     { display: none; }
    .gacha-machine[data-state="spinning"] .btn-gacha-close    { display: none; }

    /* State machine: reveal */
    .gacha-machine[data-state="reveal"] .gacha-idle-capsule { display: none; }
    .gacha-machine[data-state="reveal"] .gacha-spinner      { display: none; }
    .gacha-machine[data-state="reveal"] .gacha-result       { display: flex; animation: gachaReveal 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
    .gacha-machine[data-state="reveal"] .btn-gacha-draw     { display: none; }
    .gacha-machine[data-state="reveal"] .btn-gacha-close    { display: block; }

    /* Rarity glow on reveal emoji (class set via JS) */
    .gacha-result__emoji--rare      { filter: drop-shadow(0 0 16px rgba(91,200,255,0.7)); }
    .gacha-result__emoji--legendary { animation: legendaryShimmer 1.5s 0.6s ease-in-out infinite; }
    .gacha-result__rarity[data-rarity="legendary"] ~ .gacha-result__name { color: gold; }

    /* Collection section */
    .gacha-collection-section { margin-top: 8px; }

    .gacha-stats-mini {
      font-size: 11px;
      color: var(--muted);
    }

    .gacha-collection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
      padding-bottom: 8px;
    }

    @media (max-width: 360px) {
      .gacha-collection-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .gacha-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px 8px;
      text-align: center;
      position: relative;
      cursor: default;
      transition: transform 0.15s;
    }

    .gacha-card:hover { transform: translateY(-2px); }

    .gacha-card--rare      { border-color: rgba(91,200,255,0.3); }
    .gacha-card--legendary { border-color: rgba(255,215,0,0.45); background: rgba(255,215,0,0.04); }

    .gacha-card__emoji { font-size: 26px; line-height: 1; }
    .gacha-card__name  { font-size: 9px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
    .gacha-card__count { position: absolute; top: 4px; right: 6px; font-size: 9px; color: var(--accent); }

    /* Keyframe animations */
    @keyframes gachaWobble {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50%       { transform: rotate(5deg) scale(1.06); }
    }

    @keyframes gachaSpin {
      0%   { transform: rotate(0deg) scale(0.7); opacity: 0.5; }
      30%  { transform: rotate(360deg) scale(1.2); opacity: 1; }
      65%  { transform: rotate(620deg) scale(1.0); opacity: 0.9; }
      100% { transform: rotate(720deg) scale(1.05); opacity: 1; }
    }

    @keyframes gachaRingPulse {
      0%   { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    @keyframes gachaReveal {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.15) rotate(4deg); opacity: 1; }
      80%  { transform: scale(0.96) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes legendaryShimmer {
      0%, 100% { filter: drop-shadow(0 0 8px gold) brightness(1); }
      50%       { filter: drop-shadow(0 0 24px gold) brightness(1.35); }
    }

    @keyframes newBadgeBounce {
      0%, 100% { transform: scale(1) rotate(-4deg); }
      50%       { transform: scale(1.18) rotate(4deg); }
    }
  </style>
</head>
<body>
<div id="app">
  <nav>
    <div class="nav-logo">Focus</div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="timer">Timer</button>
      <button class="nav-tab" data-page="todos">Tasks</button>
      <button class="nav-tab" data-page="review">Review</button>
    </div>
  </nav>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <div class="install-banner-text">安裝到主畫面，離線也能使用</div>
    <button class="btn-install" id="installBtn">安裝</button>
    <button class="banner-close" id="closeBanner">×</button>
  </div>

  <!-- Timer Page -->
  <div class="page active" id="page-timer">
    <div class="timer-card" id="timerCard">
      <div class="mode-label" id="modeLabel">專注時間</div>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 220 220">
          <circle class="ring-track" cx="110" cy="110" r="100"/>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"/>
        </svg>
        <div class="timer-display">
          <div class="timer-time" id="timerDisplay">25:00</div>
          <div class="timer-session" id="sessionDisplay">第 1 個蕃茄</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="btn btn-ghost" id="btnReset" title="重置">↺</button>
        <button class="btn btn-primary" id="btnStart">開始</button>
        <button class="btn btn-ghost" id="btnSkip" title="跳過">↠</button>
      </div>
      <div class="timer-settings">
        <div class="setting-item" id="setFocus">
          <div class="setting-value" id="valFocus">25</div>
          <div class="setting-label">專注</div>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-item" id="setBreak">
          <div class="setting-value" id="valBreak">5</div>
          <div class="setting-label">休息</div>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-item" id="setLong">
          <div class="setting-value" id="valLong">15</div>
          <div class="setting-label">長休息</div>
        </div>
      </div>
    </div>

    <div class="current-task-banner" id="currentTaskBanner">
      <div class="dot"></div>
      <div class="current-task-text empty" id="currentTaskText">點擊選擇當前任務…</div>
      <div style="font-size:11px;color:var(--muted);">▸</div>
    </div>

    <div class="section-header">
      <div class="section-title">待辦事項</div>
      <button class="btn-add" id="addTodoTimer">+</button>
    </div>
    <div class="todo-input-row" id="todoInputRowTimer">
      <input class="todo-input" id="todoInputTimer" placeholder="新增任務…" maxlength="80" />
      <button class="btn-confirm" id="confirmTodoTimer">新增</button>
    </div>
    <div class="todo-list" id="todoListTimer"></div>
    <div class="spacer"></div>
  </div>

  <!-- Tasks Page -->
  <div class="page" id="page-todos">
    <div class="section-header">
      <div class="section-title">所有任務</div>
      <button class="btn-add" id="addTodoMain">+</button>
    </div>
    <div class="todo-input-row" id="todoInputRowMain">
      <input class="todo-input" id="todoInputMain" placeholder="新增任務…" maxlength="80" />
      <button class="btn-confirm" id="confirmTodoMain">新增</button>
    </div>
    <div class="todo-list" id="todoListMain"></div>
    <div class="spacer"></div>
  </div>

  <!-- Weekly Review Page -->
  <div class="page" id="page-review">
    <div class="week-nav">
      <button class="week-arrow" id="prevWeek">‹</button>
      <div class="week-label" id="weekLabel">本週</div>
      <button class="week-arrow" id="nextWeek">›</button>
    </div>
    <div class="review-stats">
      <div class="stat-card">
        <div class="stat-value" id="statPomodoros">0</div>
        <div class="stat-label">蕃茄鐘</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statMinutes">0</div>
        <div class="stat-label">分鐘</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statTasks">0</div>
        <div class="stat-label">任務完成</div>
      </div>
    </div>
    <div class="section-title" style="margin-bottom:12px;">工作記錄</div>
    <div class="sessions-list" id="sessionsList"></div>
    <div class="gacha-collection-section">
      <div class="section-header" style="margin-top:24px;margin-bottom:8px;">
        <div class="section-title">🥚 扭蛋收藏</div>
        <div class="gacha-stats-mini">
          <span id="gachaUniqueCount">0</span>/18 種 · 共 <span id="gachaTotalDraws">0</span> 次
        </div>
      </div>
      <div class="gacha-collection-grid" id="gachaCollectionGrid"></div>
    </div>
    <div class="spacer"></div>
  </div>
</div>

<!-- Session Complete Modal -->
<div class="modal-overlay" id="sessionModal">
  <div class="modal">
    <div class="modal-title">🍅 蕃茄鐘完成！</div>
    <div class="modal-sub">這段時間你做了什麼？記錄下來幫助你每週回顧。</div>
    <div class="modal-task-row">
      <div class="modal-label">關聯任務</div>
      <div class="modal-task-chips" id="modalTaskChips"></div>
    </div>
    <textarea class="modal-textarea" id="sessionNote" placeholder="簡單記錄一下這段時間的進展、想法、或任何值得記下的事…"></textarea>
    <div class="modal-actions">
      <button class="btn-modal-skip" id="skipSession">跳過</button>
      <button class="btn-modal-save" id="saveSession">儲存記錄</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-title">設定時間</div>
    <div class="modal-sub">調整後下次開始時生效（分鐘）</div>
    <div style="display:flex;gap:20px;align-items:center;margin-bottom:24px;">
      <div style="text-align:center;">
        <input class="setting-input" id="inputFocus" type="number" min="1" max="99" />
        <div class="modal-label" style="margin-top:8px;">專注</div>
      </div>
      <div style="text-align:center;">
        <input class="setting-input" id="inputBreak" type="number" min="1" max="99" />
        <div class="modal-label" style="margin-top:8px;">休息</div>
      </div>
      <div style="text-align:center;">
        <input class="setting-input" id="inputLong" type="number" min="1" max="99" />
        <div class="modal-label" style="margin-top:8px;">長休息</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-skip" id="cancelSettings">取消</button>
      <button class="btn-modal-save" id="saveSettings">儲存</button>
    </div>
  </div>
</div>

<!-- Task Select Modal -->
<div class="modal-overlay" id="taskSelectModal">
  <div class="modal">
    <div class="modal-title">選擇任務</div>
    <div class="modal-sub">選擇你現在要專注的任務</div>
    <div class="modal-task-chips" id="taskSelectChips" style="margin-bottom:24px;"></div>
    <div class="modal-actions">
      <button class="btn-modal-skip" id="cancelTaskSelect">取消</button>
      <button class="btn-modal-save" id="clearCurrentTask">清除選擇</button>
    </div>
  </div>
</div>

<!-- Gacha Modal -->
<div class="modal-overlay" id="gachaModal">
  <div class="modal modal--gacha">
    <div class="gacha-machine" id="gachaMachine" data-state="idle">
      <div class="gacha-machine__header">🎰 蕃茄扭蛋機</div>
      <div class="gacha-machine__sub">恭喜完成一個蕃茄！抽個扭蛋吧 🥚</div>
      <div class="gacha-viewport">
        <div class="gacha-idle-capsule">🥚</div>
        <div class="gacha-spinner">
          <div class="gacha-spin-rings"></div>
          <div class="gacha-capsule-spin">🥚</div>
        </div>
        <div class="gacha-result">
          <div class="gacha-result__emoji" id="gachaResultEmoji"></div>
          <div class="gacha-result__rarity" id="gachaResultRarity" data-rarity="common">普通</div>
          <div class="gacha-result__name" id="gachaResultName"></div>
          <div class="gacha-result__desc" id="gachaResultDesc"></div>
          <div class="gacha-new-badge" id="gachaNewBadge">NEW!</div>
        </div>
      </div>
      <div class="gacha-actions">
        <button class="btn-gacha-draw" id="btnGachaDraw">🎰 抽！</button>
        <button class="btn-gacha-close" id="btnGachaClose">繼續休息 →</button>
      </div>
    </div>
  </div>
</div>
